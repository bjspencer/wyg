name: Update NBA Players Cache

on:
  # Run on schedule - update cache daily at 3 AM UTC
  schedule:
    - cron: '0 3 * * *'  # Daily at 3 AM UTC
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

jobs:
  update-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update cache
        run: python update_cache.py

      - name: Check if cache changed
        id: cache-check
        run: |
          if git diff --quiet nba_players_cache.csv; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.cache-check.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add nba_players_cache.csv
          git commit -m "chore: update NBA players cache - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push

      - name: Cache already up to date
        if: steps.cache-check.outputs.changed == 'false'
        run: echo "Cache file is already up to date. No changes to commit."
